services:

  db:
    image: postgres:12
    container_name: postgres_student
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: student
      POSTGRES_DB: student_task
    volumes:
      - db_data_student:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db_data_student: