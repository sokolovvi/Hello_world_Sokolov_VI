<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анализ студенческой БД</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>📈 Анализ успеваемости</h1>
        <p>Интерактивный дашборд для базы student_task</p>
    </header>

    <div class="layout">
        <aside class="controls">
            <h2>Статистика</h2>
            <button class="action-btn" data-action="stat" data-metric="mean">📊 Средний балл</button>
            <button class="action-btn" data-action="stat" data-metric="median">📈 Медиана</button>
            <button class="action-btn" data-action="stat" data-metric="total">🔢 Количество оценок</button>
            <button class="action-btn" data-action="stat" data-metric="min">⬇️ Минимум</button>
            <button class="action-btn" data-action="stat" data-metric="max">⬆️ Максимум</button>

            <h2>Графики</h2>
            <button class="action-btn" data-action="chart" data-kind="histogram">📊 Распределение оценок</button>
            <button class="action-btn" data-action="chart" data-kind="courses">🏫 Средний балл по курсам</button>

            <button class="action-btn clear" id="clear-btn">🗑 Очистить</button>
        </aside>

        <main id="result-area">
            <p class="placeholder">← Нажмите кнопку, чтобы увидеть результат</p>
        </main>
    </div>

    <footer>
        <p>© 2026 Ваше Имя · Учебный проект</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
