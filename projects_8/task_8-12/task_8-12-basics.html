<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Базовые селекторы CSS</title>
    <style>
        /* 1. Универсальный селектор */
        * {
            box-sizing: border-box;
        }

        /* 2. Селектор по тегу body */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        /* 3. Селектор по тегу p (общий для всех абзацев) */
        p {
            color: #2c3e50;
            margin-bottom: 12px;
        }

        /* 4. Селектор по классу .lead — для ведущего абзаца */
        .lead {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1e466e;
            background: #e0eaff;
            padding: 10px;
            border-left: 4px solid #3498db;
        }

        /* 5. Селектор по id #title */
        #title {
            text-align: center;
            color: #2c3e50;
            border-bottom: 3px solid #4caf50;
            padding-bottom: 10px;
        }

        /* 6. Группировка через запятую (для заголовков h1, h2, h3) */
        h1, h2, h3 {
            margin-top: 0;
        }

        /* Общие стили для всех блоков .box */
        .box {
            background: white;
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        /* 7. Селектор с двумя классами слитно: .box.highlight */
        .box.highlight {
            background: #fff9c4;
            border-color: #f39c12;
        }

        /* 8. Селектор с тремя классами слитно: .box.highlight.large */
        .box.highlight.large {
            font-size: 1.2rem;
            padding: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1 id="title">Практика селекторов CSS</h1>
    <p>Обычный абзац без класса. Он имеет стили от селектора p.</p>
    <p class="lead">Это ведущий абзац с классом .lead — он выделяется фоном и рамкой.</p>

    <div class="box">Простой блок .box</div>
    <div class="box highlight">Блок с классами .box .highlight</div>
    <div class="box highlight large">Блок с тремя классами: .box .highlight .large</div>
</body>
</html>
